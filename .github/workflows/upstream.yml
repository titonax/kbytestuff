name: Update from fork release

on:
  schedule:
    - cron: '23 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: upstream-review
  cancel-in-progress: false

jobs:
  propose:
    if: github.repository == 'titonax/kbytestuff' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false
      - name: Find latest stable release
        id: upstream
        uses: actions/github-script@v8
        with:
          script: |
            const repo = {owner: 'k1tbyte', repo: 'Wand-Enhancer'};
            const {data: release} = await github.rest.repos.getLatestRelease(repo);
            if (!/^v?\d+\.\d+\.\d+\.\d+$/.test(release.tag_name)) throw new Error('Unsupported upstream version');
            const {data: commit} = await github.rest.repos.getCommit({...repo, ref: release.tag_name});
            core.setOutput('version', release.tag_name);
            core.setOutput('sha', commit.sha);
            await core.summary.addLink(release.tag_name, release.html_url).write();
      - name: Create review branch and pull request
        env:
          GH_TOKEN: ${{ github.token }}
          UPSTREAM_SHA: ${{ steps.upstream.outputs.sha }}
          VERSION: ${{ steps.upstream.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch https://github.com/k1tbyte/Wand-Enhancer.git "$UPSTREAM_SHA"
          if git merge-base --is-ancestor "$UPSTREAM_SHA" HEAD; then
            echo 'Upstream release is already incorporated.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="upstream/release-$VERSION"
          if git ls-remote --exit-code --heads origin "$branch" >/dev/null; then
            if ! gh pr list --repo "$GITHUB_REPOSITORY" --state open --head "$branch" --json number --jq '.[0].number' | grep -q '[0-9]'; then
              gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --draft \
                --title "Review upstream release $VERSION" \
                --body "Upstream commit: $UPSTREAM_SHA. Review all changes before merging. Build and publication are separate manual steps."
            fi
            echo "Review branch $branch already exists; it was not overwritten." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git switch -c "$branch"
          if ! git merge --no-commit --no-ff "$UPSTREAM_SHA"; then
            git restore --source=HEAD --staged --worktree .github/workflows
            if [[ -n "$(git diff --name-only --diff-filter=U)" ]]; then
              echo 'Merge conflicts require manual resolution. No branch was pushed:' >&2
              git diff --name-only --diff-filter=U >&2
              exit 1
            fi
          else
            git restore --source=HEAD --staged --worktree .github/workflows
          fi
          git commit -m "chore: propose upstream $VERSION"
          gh auth setup-git
          git push origin "HEAD:refs/heads/$branch"
          gh pr create --repo "$GITHUB_REPOSITORY" --base master --head "$branch" --draft \
            --title "Review upstream release $VERSION" \
            --body "Upstream commit: $UPSTREAM_SHA. Review all changes, especially fork customizations, before merging. Build and publication are separate manual steps."
