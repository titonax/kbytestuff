name: Generate artifact

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version matching the reviewed source and changelog (for example 2.2.1.0)
        type: string
        required: true
  workflow_call:
    inputs:
      source_ref:
        type: string
        required: true
      version:
        type: string
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/master'
    uses: ./.github/workflows/build.yml
    with:
      source_ref: ${{ inputs.source_ref || github.sha }}
      version: ${{ inputs.version }}

  publish:
    if: github.repository == 'titonax/kbytestuff'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.source_ref || github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v7
        with:
          pattern: Wagic-Builder-*
          path: artifacts
          merge-multiple: true

      - name: Publish both tested variants
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.version }}
          SOURCE_SHA: ${{ inputs.source_ref || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_VERSION" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
          if gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$RELEASE_VERSION" >/dev/null 2>&1; then
            tag_commit=$(gh api "repos/$GITHUB_REPOSITORY/commits/$RELEASE_VERSION" --jq .sha)
            if [[ "$tag_commit" != "$SOURCE_SHA" ]]; then
              echo 'Existing tag points to a different commit; refusing to relabel binaries.' >&2
              exit 1
            fi
          fi
          for variant in offline update-notifications; do
            test -s "artifacts/Wagic-Builder-$RELEASE_VERSION-$variant.zip"
            test -s "artifacts/Wagic-Builder-$RELEASE_VERSION-$variant.exe"
            (cd artifacts && sha256sum --check "SHA256-$variant.txt")
          done
          {
            echo "Unofficial, unsigned builds from $GITHUB_REPOSITORY at $SOURCE_SHA."
            echo
            echo "offline: update checks excluded. update: checks this fork's Releases; does not auto-install."
            echo "ZIP archives include runtime files, license, changelog and build provenance."
            echo
            pwsh -File scripts/get-changelog-section.ps1 -Version "$RELEASE_VERSION"
          } > release-notes.md
          flags=()
          if [[ "$RELEASE_VERSION" == *-* ]]; then flags+=(--prerelease --latest=false); else flags+=(--latest); fi
          if ! gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" \
              --target "$SOURCE_SHA" --title "Wagic Builder $RELEASE_VERSION (unofficial)" \
              --notes-file release-notes.md --draft "${flags[@]}"
          fi
          gh release upload "$RELEASE_VERSION" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          gh release edit "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --draft=false "${flags[@]}"
